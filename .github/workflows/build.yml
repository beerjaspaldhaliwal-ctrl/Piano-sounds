name: Build plug-in

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0.$GITHUB_RUN_NUMBER"; fi
          echo "KV_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building version $V"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev libegl-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS, universal binary)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test every factory preset
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        shell: bash
        run: |
          VST3=build/Keyverse_artefacts/Release/VST3/Keyverse.vst3
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get install -y xvfb
              curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
              unzip -q pv.zip
              xvfb-run -a ./pluginval --strictness-level 8 --validate-in-process "$VST3" ;;
            macOS)
              curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
              unzip -q pv.zip
              ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process "$VST3" ;;
            Windows)
              curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
              unzip -q pv.zip
              ./pluginval.exe --strictness-level 8 --validate-in-process "$VST3" ;;
          esac

      - name: Collect plug-ins
        shell: bash
        run: |
          OUT=dist/Keyverse
          mkdir -p "$OUT"
          ART=build/Keyverse_artefacts/Release
          cp -R "$ART/VST3/Keyverse.vst3" "$OUT/"
          if [ -d "$ART/AU/Keyverse.component" ]; then cp -R "$ART/AU/Keyverse.component" "$OUT/"; fi
          if [ -d "$ART/LV2/Keyverse.lv2" ]; then cp -R "$ART/LV2/Keyverse.lv2" "$OUT/"; fi
          if [ -d "$ART/Standalone/Keyverse.app" ]; then cp -R "$ART/Standalone/Keyverse.app" "$OUT/"; fi
          if [ -f "$ART/Standalone/Keyverse.exe" ]; then cp "$ART/Standalone/Keyverse.exe" "$OUT/"; fi
          if [ -f "$ART/Standalone/Keyverse" ]; then cp "$ART/Standalone/Keyverse" "$OUT/"; chmod +x "$OUT/Keyverse"; fi
          cp docs/INSTALL.md "$OUT/INSTALL.md"
          ls -la "$OUT"

      # Unsigned arm64 code will not load on Apple Silicon; an ad-hoc signature is enough to run locally.
      - name: Ad-hoc sign macOS bundles
        if: runner.os == 'macOS'
        run: |
          for b in dist/Keyverse/Keyverse.vst3 dist/Keyverse/Keyverse.component dist/Keyverse/Keyverse.app; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict --verbose=1 "$b"
          done

      # Artifact uploads drop file permissions, which breaks macOS bundles and the Linux
      # standalone, so macOS and Linux are packed into an archive that keeps them.
      - name: Package
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in
            macOS) ditto -c -k --sequesterRsrc --keepParent Keyverse ../Keyverse-macOS.zip ;;
            Linux) tar czf ../Keyverse-Linux.tar.gz Keyverse ;;
            Windows) mv Keyverse ../Keyverse-Windows ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Keyverse-${{ matrix.name }}
          path: |
            Keyverse-macOS.zip
            Keyverse-Linux.tar.gz
            Keyverse-Windows
          if-no-files-found: error

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:KV_VERSION" "/DSourceDir=$PWD\Keyverse-Windows" installer\Keyverse.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-Item installer-out\Keyverse-Windows-Setup.exe

      # Install silently on the runner, validate the installed plug-in, then uninstall.
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath installer-out\Keyverse-Windows-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $vst3 = "$env:CommonProgramFiles\VST3\Keyverse.vst3"
          $app = "$env:ProgramFiles\Keyverse\Keyverse.exe"
          if (-not (Test-Path "$vst3\Contents\x86_64-win\Keyverse.vst3")) { throw "VST3 was not installed to $vst3" }
          if (-not (Test-Path $app)) { throw "standalone app was not installed to $app" }
          .\pluginval.exe --strictness-level 5 --validate-in-process "$vst3"
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed on the installed plug-in" }
          # The uninstaller relaunches itself from %TEMP%, so wait for the files to disappear
          Start-Process -FilePath "$env:ProgramFiles\Keyverse\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path $vst3) -or (Test-Path $app)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $vst3) { throw "uninstaller left $vst3 behind" }
          if (Test-Path $app) { throw "uninstaller left $app behind" }
          Write-Host "Installer install/validate/uninstall test passed"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Keyverse-Windows-Setup
          path: installer-out/Keyverse-Windows-Setup.exe
          if-no-files-found: error

  # Pushing a tag such as v1.0.0 publishes a GitHub Release with the installer
  # and archives (downloadable without signing in to GitHub).
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release files
        run: |
          mkdir release portable
          cp artifacts/Keyverse-Windows-Setup/Keyverse-Windows-Setup.exe release/
          cp artifacts/Keyverse-macOS/Keyverse-macOS.zip release/
          cp artifacts/Keyverse-Linux/Keyverse-Linux.tar.gz release/
          W=artifacts/Keyverse-Windows
          if [ -d "$W/Keyverse-Windows" ]; then W="$W/Keyverse-Windows"; fi
          cp -R "$W" portable/Keyverse
          (cd portable && zip -qr ../release/Keyverse-Windows-Portable.zip Keyverse)
          ls -la release

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Keyverse ${{ github.ref_name }}
          files: release/*
          body: |
            ## Download

            | System | File |
            |---|---|
            | **Windows** (installer) | `Keyverse-Windows-Setup.exe`: double-click and follow the steps |
            | Windows (no installer) | `Keyverse-Windows-Portable.zip` |
            | macOS (Intel and Apple Silicon) | `Keyverse-macOS.zip` |
            | Linux | `Keyverse-Linux.tar.gz` |

            **Windows:** run `Keyverse-Windows-Setup.exe`. If Windows shows "Windows protected your PC", click **More info** and then **Run anyway** (the installer is not code-signed). Then open your DAW, rescan plug-ins, and load **Keyverse** as an instrument.

            **macOS / Linux:** see `INSTALL.md` inside the download.
