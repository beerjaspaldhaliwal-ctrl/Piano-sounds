name: Build plug-in

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev libegl-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS, universal binary)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test every factory preset
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect plug-ins
        shell: bash
        run: |
          mkdir -p dist
          ART=build/Keyverse_artefacts/Release
          cp -R "$ART/VST3/Keyverse.vst3" dist/
          if [ -d "$ART/AU/Keyverse.component" ]; then cp -R "$ART/AU/Keyverse.component" dist/; fi
          if [ -d "$ART/LV2/Keyverse.lv2" ]; then cp -R "$ART/LV2/Keyverse.lv2" dist/; fi
          if [ -d "$ART/Standalone/Keyverse.app" ]; then cp -R "$ART/Standalone/Keyverse.app" dist/; fi
          if [ -f "$ART/Standalone/Keyverse.exe" ]; then cp "$ART/Standalone/Keyverse.exe" dist/; fi
          if [ -f "$ART/Standalone/Keyverse" ]; then cp "$ART/Standalone/Keyverse" dist/; fi
          cp README.md dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Keyverse-${{ matrix.name }}
          path: dist
